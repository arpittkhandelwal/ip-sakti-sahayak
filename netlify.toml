[build]
  command = "npm run ingest && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "10"
  SECRETS_SCAN_OMIT_KEYS = "INPUT_MAX_CHARS,SARVAM_TTS_MODEL,SARVAM_TRANSLATE_MODEL,SARVAM_CHAT_MODEL,SARVAM_STT_MODEL,SARVAM_LID_MODEL,RATE_LIMIT_RPM,TOP_K,LLM_RERANK_TOP_N,MIN_SCORE_THRESHOLD,VITE_ENABLE_VOICE,VITE_ENABLE_LLM_RERANK"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/data/**"]

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  framework = "#custom"
  autoLaunch = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://api.sarvam.ai ws: wss: http://localhost:* ws://localhost:*; img-src 'self' data: https:; frame-ancestors 'none';"
